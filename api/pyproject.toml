[project]
name = "botgraph-api"
version = "0.1.0"
description = "BotGraph REST + WebSocket API for the analyst console"
requires-python = ">=3.11"
dependencies = [
    "botgraph-stream",
    "fastapi>=0.115",
    "pyjwt>=2.9",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
botgraph-api = "botgraph_api.cli:main"

[tool.uv.sources]
botgraph-stream = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/botgraph_api"]
