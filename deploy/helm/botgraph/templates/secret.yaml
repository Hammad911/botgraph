{{- if not .Values.existingSecret }}
{{- $jwt := required "secrets.jwtSecret is required (openssl rand -base64 48), or set existingSecret" .Values.secrets.jwtSecret }}
{{- if lt (len $jwt) 32 }}{{ fail "secrets.jwtSecret must be at least 32 characters" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "botgraph.secretName" . }}
  labels: {{- include "botgraph.labels" . | nindent 4 }}
  {{- if .Values.migrations.enabled }}
  annotations:
    # The migration hook runs before regular resources exist, so the secret is a hook too.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
type: Opaque
stringData:
  BOTGRAPH_DB_URL: {{ required "secrets.dbUrl is required, or set existingSecret" .Values.secrets.dbUrl | quote }}
  BOTGRAPH_JWT_SECRET: {{ $jwt | quote }}
  {{- with .Values.secrets.kafkaUsername }}
  BOTGRAPH_KAFKA_SASL_USERNAME: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.kafkaPassword }}
  BOTGRAPH_KAFKA_SASL_PASSWORD: {{ . | quote }}
  {{- end }}
{{- end }}
