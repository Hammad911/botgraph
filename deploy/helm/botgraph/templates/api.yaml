{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "botgraph.fullname" . }}-api
  labels: {{- include "botgraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "botgraph.selector" (list . "api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "botgraph.selector" (list . "api") | nindent 8 }}
    spec:
      {{- include "botgraph.podDefaults" . | nindent 6 }}
      containers:
        - name: api
          image: {{ include "botgraph.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [botgraph-api]
          args: [serve, --host, 0.0.0.0, --port, "8000"]
          env:
            {{- include "botgraph.env" . | nindent 12 }}
            - name: BOTGRAPH_JWT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ include "botgraph.secretName" . }}, key: BOTGRAPH_JWT_SECRET }
            - name: BOTGRAPH_CORS_ORIGINS
              value: {{ .Values.api.corsOrigins | default (include "botgraph.host" .) | quote }}
            - name: BOTGRAPH_TOKEN_TTL_MINUTES
              value: {{ .Values.api.tokenTtlMinutes | quote }}
            - name: BOTGRAPH_LOGIN_RATE_LIMIT
              value: {{ .Values.api.loginRateLimit | quote }}
            - name: BOTGRAPH_TRUSTED_PROXIES
              value: {{ .Values.api.trustedProxies | quote }}
          ports:
            - { name: http, containerPort: 8000 }
            - { name: metrics, containerPort: {{ .Values.metricsPort }} }
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /api/ready, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts: {{- include "botgraph.scratchMounts" . | nindent 12 }}
      volumes: {{- include "botgraph.scratchVolumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "botgraph.fullname" . }}-api
  labels: {{- include "botgraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
    botgraph.io/metrics: "true"
spec:
  selector: {{- include "botgraph.selector" (list . "api") | nindent 4 }}
  ports:
    - { name: http, port: 8000, targetPort: http }
    - { name: metrics, port: {{ .Values.metricsPort }}, targetPort: metrics }
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "botgraph.fullname" . }}-api
  labels: {{- include "botgraph.labels" . | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "botgraph.fullname" . }}-api }
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
{{- if .Values.api.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "botgraph.fullname" . }}-api
  labels: {{- include "botgraph.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels: {{- include "botgraph.selector" (list . "api") | nindent 6 }}
{{- end }}
{{- end }}
