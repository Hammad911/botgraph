{{- if .Values.ingest.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "botgraph.fullname" . }}-ingest
  labels: {{- include "botgraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingest
spec:
  replicas: {{ .Values.ingest.replicas }}
  selector:
    matchLabels: {{- include "botgraph.selector" (list . "ingest") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "botgraph.selector" (list . "ingest") | nindent 8 }}
    spec:
      {{- include "botgraph.podDefaults" . | nindent 6 }}
      containers:
        - name: ingest
          image: {{ include "botgraph.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [ingest, --topic-prefix, {{ .Values.kafka.topicPrefix | quote }}]
          env:
            {{- include "botgraph.env" . | nindent 12 }}
            {{- include "botgraph.kafkaEnv" . | nindent 12 }}
          ports:
            - { name: metrics, containerPort: {{ .Values.metricsPort }} }
          {{- include "botgraph.probes" . | nindent 10 }}
          resources: {{- toYaml .Values.ingest.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts: {{- include "botgraph.scratchMounts" . | nindent 12 }}
      volumes: {{- include "botgraph.scratchVolumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "botgraph.fullname" . }}-ingest
  labels: {{- include "botgraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingest
    botgraph.io/metrics: "true"
spec:
  selector: {{- include "botgraph.selector" (list . "ingest") | nindent 4 }}
  ports:
    - { name: metrics, port: {{ .Values.metricsPort }}, targetPort: metrics }
{{- end }}
