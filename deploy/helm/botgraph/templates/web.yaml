{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "botgraph.fullname" . }}-web
  labels: {{- include "botgraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: {{- include "botgraph.selector" (list . "web") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "botgraph.selector" (list . "web") | nindent 8 }}
    spec:
      {{- include "botgraph.podDefaults" . | nindent 6 }}
      containers:
        - name: web
          image: {{ .Values.webImage.repository }}:{{ .Values.webImage.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.webImage.pullPolicy }}
          ports:
            - { name: http, containerPort: 3000 }
          livenessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /web/.next/cache }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: cache, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "botgraph.fullname" . }}-web
  labels: {{- include "botgraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector: {{- include "botgraph.selector" (list . "web") | nindent 4 }}
  ports:
    - { name: http, port: 3000, targetPort: http }
{{- end }}
