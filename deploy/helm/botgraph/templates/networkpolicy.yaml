{{- if .Values.networkPolicy.enabled }}
{{- $ingressNs := .Values.networkPolicy.ingressNamespaceSelector }}
{{- $monitoringNs := .Values.networkPolicy.monitoringNamespaceSelector }}
# Default deny for BotGraph pods, then only: the ingress controller to the API and console,
# the console to the API, and Prometheus to the metrics ports. Egress is left open (Kafka and
# Postgres are external and their addresses vary).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "botgraph.fullname" . }}-default-deny
  labels: {{- include "botgraph.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "botgraph.fullname" . }}-api
  labels: {{- include "botgraph.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "botgraph.selector" (list . "api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {{- toYaml $ingressNs | nindent 14 }}
        - podSelector:
            matchLabels: {{- include "botgraph.selector" (list . "web") | nindent 14 }}
      ports: [{ port: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "botgraph.fullname" . }}-web
  labels: {{- include "botgraph.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "botgraph.selector" (list . "web") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {{- toYaml $ingressNs | nindent 14 }}
      ports: [{ port: 3000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "botgraph.fullname" . }}-metrics
  labels: {{- include "botgraph.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {{- toYaml $monitoringNs | nindent 14 }}
      ports: [{ port: {{ .Values.metricsPort }} }]
{{- end }}
