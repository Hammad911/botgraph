# Local development infrastructure. Application services are added in later phases.
#   docker compose -f deploy/compose/docker-compose.yml up -d
name: botgraph

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]
    volumes: [redpanda:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 10s
      retries: 10

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ["8081:8080"]
    depends_on:
      redpanda: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-botgraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-botgraph}
      POSTGRES_DB: ${POSTGRES_DB:-botgraph}
    ports: ["5432:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-botgraph}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-botgraph}
      CLICKHOUSE_DB: botgraph
    ports: ["8123:8123", "9000:9000"]
    volumes: [clickhouse:/var/lib/clickhouse]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
    ports: ["5000:5000"]
    volumes: [mlflow:/mlflow]

volumes:
  redpanda:
  postgres:
  clickhouse:
  mlflow:
