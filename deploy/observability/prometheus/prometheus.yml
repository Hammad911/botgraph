# Prometheus for the compose stack (docker compose --profile pipeline --profile observability).
# In Kubernetes the Helm chart creates ServiceMonitors and a PrometheusRule instead.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: botgraph-ingest
    static_configs: [{ targets: ["ingest:9100"] }]
  - job_name: botgraph-detector
    static_configs: [{ targets: ["detector:9100"] }]
  - job_name: botgraph-api
    static_configs: [{ targets: ["api:9100"] }]
