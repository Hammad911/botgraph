[project]
name = "botgraph-stream"
version = "0.1.0"
description = "Live BotGraph pipeline: ingest, streaming windows, GNN detection, alerting, replay"
requires-python = ">=3.11"
dependencies = [
    "botgraph-core",
    "botgraph-ml",
    "confluent-kafka>=2.5",
    "prometheus-client>=0.20",
    "psycopg[binary]>=3.2",
    "rich>=13.7",
    "sqlalchemy>=2.0",
]

[project.scripts]
botgraph = "botgraph_stream.cli:main"

[tool.uv.sources]
botgraph-core = { workspace = true }
botgraph-ml = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/botgraph_stream"]
