name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install  # version from .python-version
      - run: uv sync
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy packages/botgraph-core/src
      - name: Test
        run: uv run pytest --cov=botgraph_core --cov-report=term-missing

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f deploy/compose/docker-compose.yml config -q
      - name: Validate Prometheus config and alert rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/deploy/helm/botgraph/files/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro" \
            prom/prometheus:v2.54.1 check config /etc/prometheus/prometheus.yml
      - name: Validate the Grafana dashboard
        run: python3 -c "import json; json.load(open('deploy/helm/botgraph/files/grafana-dashboard.json'))"
      - name: Build the service image
        run: docker build -f deploy/Dockerfile -t botgraph:ci .
      - name: Build the console image
        run: docker build -f deploy/web.Dockerfile -t botgraph-web:ci .
      - name: The service image runs as non-root on a read-only filesystem
        run: |
          test "$(docker run --rm --entrypoint id botgraph:ci -u)" = 10001
          docker run --rm --read-only --tmpfs /tmp botgraph:ci --help > /dev/null
      - name: Scan images for fixable critical/high vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: botgraph:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan the console image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: botgraph-web:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Lint
        run: helm lint deploy/helm/botgraph -f deploy/helm/botgraph/ci/test-values.yaml
      - name: Render and validate against Kubernetes schemas (CRDs included)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz kubeconform
          helm template ci deploy/helm/botgraph -f deploy/helm/botgraph/ci/test-values.yaml \
            | ./kubeconform -strict -summary -kubernetes-version 1.30.0 \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      - name: Refuses to render without secrets
        run: "! helm template ci deploy/helm/botgraph --set models.existingClaim=m"

  dependencies:
    # Known vulnerabilities in the locked Python and npm dependencies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Python (pip-audit on uv.lock)
        run: |
          uv export --frozen --no-dev --no-emit-workspace --no-hashes --format requirements-txt -o req.txt
          uvx pip-audit -r req.txt --no-deps --disable-pip --strict
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm (production dependencies)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  stream-kafka:
    # The live pipeline over a real broker and Postgres (not available on the dev laptop).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: botgraph
          POSTGRES_PASSWORD: botgraph
          POSTGRES_DB: botgraph
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U botgraph"
          --health-interval 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Start Redpanda
        run: |
          docker run -d --name redpanda -p 19092:19092 \
            docker.redpanda.com/redpandadata/redpanda:v24.2.4 \
            redpanda start --mode dev-container --smp 1 \
            --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092 \
            --advertise-kafka-addr internal://localhost:9092,external://localhost:19092
          timeout 90 docker exec redpanda rpk cluster health --watch --exit-when-healthy
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync
      - name: Kafka + Postgres end-to-end
        env:
          BOTGRAPH_KAFKA_BOOTSTRAP: localhost:19092
          BOTGRAPH_TEST_DB_URL: postgresql+psycopg://botgraph:botgraph@localhost:5432/botgraph
        run: uv run pytest -m kafka services -rs

  web:
    # Analyst console: lint, types, then Playwright end-to-end against a seeded API and a
    # production build of the console.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install
        working-directory: .
      - run: uv sync
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: End-to-end (login, alert explanation, triage, host timeline, live map)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results/
