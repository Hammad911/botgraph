[project]
name = "botgraph-ml"
version = "0.1.0"
description = "Dataset preparation, training and evaluation for BotGraph"
requires-python = ">=3.11"
dependencies = [
    "botgraph-core",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "tqdm>=4.66",
    "xgboost>=2.1",
]

[tool.uv.sources]
botgraph-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/botgraph_ml"]
